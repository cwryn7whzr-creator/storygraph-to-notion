name: StoryGraph to Notion Sync

on:
  schedule:
    - cron: "0 13 * * 1,3,5"

  workflow_dispatch:
    inputs:
      mode:
        description: "active = to-read + currently-reading | full = also books-read | cleanup = Notion-only preview/cleanup"
        type: choice
        options:
          - active
          - full
          - cleanup
        default: active

      apply:
        description: "Cleanup only: check this to apply changes. Leave unchecked for preview."
        type: boolean
        default: false

      tags:
        description: "Full only: import moods and genres."
        type: boolean
        default: false

      min_year:
        description: "Cleanup only: report Years Read values before this year."
        type: string
        default: "2018"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync StoryGraph to Notion
        run: node utils/syncToNotion.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SYNC_MODE: ${{ inputs.mode || 'active' }}
          CLEANUP_APPLY: ${{ inputs.apply && 'true' || 'false' }}
          MIN_YEAR_READ: ${{ inputs.min_year || '2018' }}
          ENRICH_TAGS: ${{ inputs.tags && '1' || '' }}
