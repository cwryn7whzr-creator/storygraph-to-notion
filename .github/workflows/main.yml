# Changes to make in your workflow file (.github/workflows/<your file>.yml).
# Only the parts shown change. Everything else in the file stays as it is.

on:
  schedule:
    # Fast run (to-read + currently-reading) three times a week: Monday, Wednesday, Friday.
    # For every day instead, use "0 13 * * *". The hour is in UTC.
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "active = to-read + currently-reading (fast) | full = also books-read, ratings, years (slow) | cleanup = merge/remove duplicates, fix Times Read and covers (Notion only)"
        type: choice
        options:
          - active
          - full
          - cleanup
        default: active
      apply:
        description: "cleanup only: tick to actually make the changes (unticked = preview only)"
        type: boolean
        default: false
      tags:
        description: "full only: also import moods and genres (slow; they rarely change, so leave unticked most of the time)"
        type: boolean
        default: false
      min_year:
        description: "cleanup only: remove any Years Read value earlier than this year (StoryGraph has no data before 2018 for this account). Leave empty to keep all years."
        type: string
        default: "2018"

jobs:
  deploy:
    # Cuts off a stuck run instead of letting it burn half an hour.
    timeout-minutes: 30
    steps:
      # ... your existing steps (checkout, setup node, install, etc.) stay unchanged ...

      # Your existing "node utils/syncToNotion.js" step: keep whatever env it already has
      # (NOTION_API_KEY, NOTION_DATABASE_ID, ...) and add these four lines under env:
      - run: node utils/syncToNotion.js
        env:
          SYNC_MODE: ${{ github.event.inputs.mode || 'active' }}
          CLEANUP_APPLY: ${{ github.event.inputs.apply || 'false' }}
          MIN_YEAR_READ: ${{ github.event.inputs.min_year || '' }}
          ENRICH_TAGS: ${{ github.event.inputs.tags == 'true' && '1' || '' }}
